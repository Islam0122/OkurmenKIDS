<!doctype html><html><head><meta charset="utf-8"><style>
@font-face { font-family: 'Manrope'; src: url('manrope-cyrillic-wght-normal.woff2') format('woff2'); font-weight: 200 800; unicode-range: U+0400-045F; }
@font-face { font-family: 'Manrope'; src: url('manrope-latin-wght-normal.woff2') format('woff2'); font-weight: 200 800; }
*{margin:0;padding:0;box-sizing:border-box} body{width:1920px;height:1080px;overflow:hidden;font-family:Manrope;color:#10231a;
background:radial-gradient(1100px 800px at 90% 10%, rgba(47,143,91,.16), transparent 60%),radial-gradient(800px 600px at 0% 100%, rgba(47,143,91,.10), transparent 60%),#f7f9f8}
.l{position:absolute;left:110px;top:170px;width:820px}
.logo{width:96px;height:96px;object-fit:contain}
h1{font-size:118px;font-weight:800;letter-spacing:-.04em;line-height:.98;margin-top:34px} h1 span{color:#2f8f5b}
.pill{display:inline-block;margin-top:34px;border:2px solid #cfe7da;background:#fff;color:#1f5f3c;border-radius:999px;padding:14px 30px;font-size:34px;font-weight:750}
.mods{margin-top:52px;display:flex;flex-wrap:wrap;gap:14px;width:760px}
.m{background:#10231a;color:#fff;border-radius:14px;padding:12px 20px;font-size:26px;font-weight:700}
.m.g{background:#2f8f5b}
.shot{position:absolute;left:930px;top:190px;width:1120px;height:630px;border-radius:24px;overflow:hidden;box-shadow:0 50px 90px -30px rgba(16,35,26,.4),0 0 0 1px rgba(16,35,26,.08);transform:perspective(2200px) rotateY(-14deg) rotateX(4deg);transform-origin:left center;background:#fff}
.shot img{width:1120px;height:630px;object-fit:cover;object-position:left top}
.phone{position:absolute;left:1360px;top:430px;width:330px;height:600px;border-radius:48px;background:#10231a;padding:12px;box-shadow:0 50px 90px -30px rgba(16,35,26,.6)}
.phone div{width:306px;height:576px;border-radius:38px;overflow:hidden;background:#fff}.phone img{width:306px;display:block}
.stack{position:absolute;left:110px;bottom:70px;font-size:26px;color:#4a5d53;font-weight:650;letter-spacing:.01em}
</style></head><body>
<div class="l"><img class="logo" src="img/logo.png"><h1>Okurmen Kids<br><span>LMS</span></h1><div class="pill">Full-Stack EdTech Platform</div>
<div class="mods"><div class="m g">Обучение</div><div class="m">HR · QR check-in</div><div class="m">Финансы</div><div class="m">Зарплаты</div><div class="m g">KPI</div></div></div>
<div class="shot"><img src="img/analytics.png"></div>
<div class="phone"><div><img src="img/m_success.png"></div></div>
<div class="stack">Django · DRF · PostgreSQL · Celery · React · TypeScript · PWA</div>
</body></html>
