{% extends "feedback/public_base.html" %}

{% block title %}{{ title }}{% endblock %}

{% block content %}
<section class="fb-card fb-message" role="status">
    <div class="fb-message-icon fb-message-icon-{{ icon }}" aria-hidden="true">
        {% if icon == "check" %}
            <svg viewBox="0 0 24 24" width="32" height="32"><path fill="currentColor" d="M9.55 17.6 4.3 12.35l1.4-1.4 3.85 3.85 8.75-8.75 1.4 1.4z"/></svg>
        {% else %}
            <svg viewBox="0 0 24 24" width="32" height="32"><path fill="currentColor" d="M6 22q-.82 0-1.41-.59T4 20V10q0-.82.59-1.41T6 8h1V6q0-2.07 1.46-3.54T12 1t3.54 1.46T17 6v2h1q.82 0 1.41.59T20 10v10q0 .82-.59 1.41T18 22zm3-14h6V6q0-1.25-.88-2.12T12 3t-2.12.88T9 6z"/></svg>
        {% endif %}
    </div>
    <h1 class="fb-message-title">{{ title }}</h1>
    <p class="fb-message-text">{{ message|linebreaksbr }}</p>
    <p class="fb-muted">{{ survey.title }}</p>
</section>
{% endblock %}
