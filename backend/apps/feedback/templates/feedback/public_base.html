{% load static %}<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="robots" content="noindex, nofollow">
    <meta name="referrer" content="no-referrer">
    <meta name="theme-color" content="#2F8F5B">
    <title>{% block title %}{{ survey.title }}{% endblock %} · OkurmenKIDS</title>
    <link rel="icon" href="{% static 'images/logo.png' %}">
    <link rel="stylesheet" href="{% static 'feedback/css/public.css' %}">
</head>
<body>
    <header class="fb-brand">
        <img src="{% static 'images/logo.png' %}" alt="" width="36" height="36">
        <span>OkurmenKIDS</span>
    </header>
    <main class="fb-main">
        {% block content %}{% endblock %}
    </main>
    <footer class="fb-footer">© OkurmenKIDS</footer>
    {% block scripts %}{% endblock %}
</body>
</html>
