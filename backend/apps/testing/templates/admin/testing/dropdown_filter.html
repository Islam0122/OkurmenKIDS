{# Jazzmin's admin/filter.html with a visible label and an explicit «Все» option. #}
{# Same select/data-name contract, so jazzmin/js/change_list.js keeps driving it. #}
<div class="form-group ok-testing-filter">
    <label class="ok-testing-filter__label" for="ok-filter-{{ field_name }}">{{ title|capfirst }}</label>
    <select class="form-control search-filter" id="ok-filter-{{ field_name }}" data-name="{{ field_name }}">
        <option value="">Все</option>
        {% for choice in choices %}
            {% if choice.name %}
                <option data-name="{{ choice.name }}" value="{{ choice.value }}"{% if choice.selected %} selected{% endif %}>{{ choice.display }}</option>
            {% endif %}
        {% endfor %}
    </select>
</div>
