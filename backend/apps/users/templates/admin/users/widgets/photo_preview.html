{% load i18n %}
<div class="ok-photo-field{% if widget.is_initial %} ok-photo-has-image{% endif %}">
  <div class="ok-photo-preview">
    <div class="ok-photo-placeholder">
      <i class="bi bi-person-fill"></i>
    </div>
    {% if widget.is_initial %}
      <img src="{{ widget.value.url }}" alt="">
    {% endif %}
  </div>

  <div class="ok-photo-content">
    <div class="ok-photo-status">
      {% if widget.is_initial %}Фотография профиля{% else %}Фотография не загружена{% endif %}
    </div>
    <div class="ok-photo-filename"{% if not widget.is_initial %} hidden{% endif %}>
      <i class="bi bi-paperclip"></i><span class="ok-photo-filename-text">{% if widget.is_initial %}{{ widget.value }}{% endif %}</span>
    </div>

    <div class="ok-photo-actions">
      <label class="ok-btn-secondary ok-btn-sm" for="{{ widget.attrs.id }}">
        <i class="bi bi-upload"></i> Изменить фотографию
      </label>

      <input
        type="{{ widget.type }}"
        name="{{ widget.name }}"
        class="ok-photo-input"
        {% include "django/forms/widgets/attrs.html" %}
      >

      {% if widget.is_initial and not widget.required %}
        <label class="ok-photo-remove-toggle" for="{{ widget.checkbox_id }}">
          <input type="checkbox" name="{{ widget.checkbox_name }}" id="{{ widget.checkbox_id }}">
          <i class="bi bi-trash3"></i> Удалить фотографию
        </label>
      {% endif %}
    </div>
  </div>
</div>
