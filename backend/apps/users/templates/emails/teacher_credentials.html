<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OkurmenKIDS</title>
</head>

<body style="
    margin: 0;
    padding: 0;
    background-color: #f0fdf4;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
">

<table width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color: #f0fdf4; padding: 40px 15px;">
    <tr>
        <td align="center">

            <!-- Main Container -->
            <table
                width="100%"
                cellpadding="0"
                cellspacing="0"
                border="0"
                style="
                    max-width: 540px;
                    background: #ffffff;
                    border-radius: 20px;
                    overflow: hidden;
                    box-shadow: 0 10px 25px -5px rgba(5, 150, 105, 0.08), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
                    border: 1px solid #e6f4ea;
                "
            >

                <!-- Top Decorative Line -->
                <tr>
                    <td style="height: 6px; background: linear-gradient(90deg, #10b981 0%, #059669 100%);"></td>
                </tr>

                <!-- Content Area -->
                <tr>
                    <td style="padding: 40px 40px 32px;">

                        <!-- Header Title -->
                        <h1 style="
                            margin: 0 0 16px;
                            font-size: 24px;
                            font-weight: 700;
                            color: #064e3b;
                            letter-spacing: -0.3px;
                            line-height: 1.3;
                        ">
                            Добро пожаловать!
                            <!-- Bootstrap Waving Hand Icon -->
                            <span style="display: inline-block; vertical-align: middle; margin-left: 4px;">
                                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="#10b981" viewBox="0 0 16 16">
                                    <path d="M14.828 7.003a.998.998 0 0 0-1.414 0l-1.586 1.586a.5.5 0 0 1-.707-.707l1.586-1.586a2 2 0 0 0 0-2.828l-.707-.707a2 2 0 0 0-2.828 0L7.586 4.343a.5.5 0 1 1-.707-.707l1.586-1.586a3 3 0 0 1 4.242 0l.707.707a3 3 0 0 1 0 4.243l-.586.586zm-10.4 1.572a.5.5 0 0 1 .707 0l2.828 2.828a.5.5 0 1 1-.707.707L4.428 9.282a.5.5 0 0 1 0-.707z"/>
                                    <path d="M8.5 1a1.5 1.5 0 0 1 1.5 1.5v3.793l.854-.853a.5.5 0 0 1 .707.707L8.707 8.999a.5.5 0 0 1-.707 0L5.146 6.146a.5.5 0 1 1 .708-.707l1.646 1.646V2.5A1.5 1.5 0 0 1 8.5 1z"/>
                                </svg>
                            </span>
                        </h1>

                        <p style="
                            margin: 0 0 24px;
                            font-size: 16px;
                            line-height: 1.6;
                            color: #374151;
                        ">
                            Здравствуйте, <strong style="color: #064e3b; font-weight: 600;">{{ user.first_name }}</strong>! Ваш аккаунт тренера в системе <strong style="color: #059669; font-weight: 600;">OkurmenKids</strong> успешно создан.
                        </p>

                        <!-- Credentials Card -->
                        <table
                            width="100%"
                            cellpadding="0"
                            cellspacing="0"
                            border="0"
                            style="
                                margin: 28px 0;
                                background-color: #f7fee7;
                                border: 1px solid #d9f99d;
                                border-radius: 14px;
                            "
                        >
                            <tr>
                                <td style="padding: 24px;">

                                    <!-- Login Field -->
                                    <p style="
                                        margin: 0 0 6px;
                                        font-size: 11px;
                                        font-weight: 700;
                                        color: #15803d;
                                        letter-spacing: 1.2px;
                                        text-transform: uppercase;
                                    ">
                                        Логин
                                    </p>
                                    <p style="
                                        margin: 0 0 20px;
                                        font-size: 17px;
                                        font-weight: 600;
                                        color: #0f172a;
                                        font-family: 'Courier New', Courier, monospace;
                                    ">
                                        {{ user.username }}
                                    </p>

                                    <!-- Divider -->
                                    <div style="height: 1px; background-color: #ecfccb; margin-bottom: 20px;"></div>

                                    <!-- Password Field -->
                                    <p style="
                                        margin: 0 0 6px;
                                        font-size: 11px;
                                        font-weight: 700;
                                        color: #15803d;
                                        letter-spacing: 1.2px;
                                        text-transform: uppercase;
                                    ">
                                        Пароль
                                    </p>
                                    <p style="
                                        margin: 0;
                                        font-size: 17px;
                                        font-weight: 600;
                                        color: #0f172a;
                                        letter-spacing: 1.5px;
                                        font-family: 'Courier New', Courier, monospace;
                                    ">
                                        {{ password }}
                                    </p>

                                </td>
                            </tr>
                        </table>

                        <!-- CTA Button -->
                        <table
                            width="100%"
                            cellpadding="0"
                            cellspacing="0"
                            border="0"
                            style="margin-top: 32px;"
                        >
                            <tr>
                                <td align="center">
                                    <a
                                        href="{{ login_url }}"
                                        style="
                                            display: inline-block;
                                            width: 100%;
                                            box-sizing: border-box;
                                            padding: 16px 28px;
                                            background-color: #10b981;
                                            color: #ffffff;
                                            text-decoration: none;
                                            font-size: 16px;
                                            font-weight: 600;
                                            border-radius: 12px;
                                            text-align: center;
                                            transition: background-color 0.2s ease;
                                        "
                                    >
                                        Войти в OkurmenKids
                                    </a>
                                </td>
                            </tr>
                        </table>

                    </td>
                </tr>

                <!-- Footer -->
                <tr>
                    <td
                        style="
                            padding: 20px 40px 28px;
                            background-color: #fafafa;
                            border-top: 1px solid #f0f0f0;
                            text-align: center;
                        "
                    >
                        <p style="
                            margin: 0 0 6px;
                            font-size: 13px;
                            font-weight: 500;
                            color: #4b5563;
                        ">
                            С уважением, команда <strong style="color: #059669;">OkurmenKids Academy</strong>
                        </p>

                        <p style="
                            margin: 0;
                            font-size: 12px;
                            color: #9ca3af;
                        ">
                            Это автоматическое письмо, на него не нужно отвечать.
                        </p>
                    </td>
                </tr>

            </table>

        </td>
    </tr>
</table>

</body>
</html>
