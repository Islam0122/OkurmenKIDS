<div class="ok-card" id="correction">
  <div class="ok-card-header"><i class="bi bi-pencil-square"></i><span>Исправить посещаемость</span></div>
  <div class="ok-card-body">
    {% if correction.allowed %}
      {% include "admin/academy/_corrections/notice.html" %}
      <form method="post" action="">
        {% csrf_token %}
        <div class="ok-grid-2">
          <div class="ok-field-group">
            <label class="ok-label" for="id_status">Статус</label>
            <select class="ok-input" id="id_status" name="status">
              {% for value, label in correction.statuses %}
                <option value="{{ value }}"{% if value == record.status %} selected{% endif %}>{{ label }}</option>
              {% endfor %}
            </select>
          </div>
          <div class="ok-field-group">
            <label class="ok-label" for="id_comment">Комментарий</label>
            <input class="ok-input" id="id_comment" name="comment" maxlength="255" value="{{ record.comment }}">
          </div>
        </div>
        <div class="ok-form-actions">
          <button type="submit" class="ok-btn-primary">Сохранить исправление</button>
        </div>
      </form>
    {% else %}
      <p class="ok-help-text" style="margin:0;">Занятие отменено — посещаемость не отмечается.</p>
    {% endif %}
  </div>
</div>
