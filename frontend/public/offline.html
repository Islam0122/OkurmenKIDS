<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="robots" content="noindex" />
    <title>Нет подключения — Okurmen Kids</title>
    <!-- Last-resort page from the service worker (pwa/sw.js) when even the
         cached app shell is unavailable. Fully self-contained: no requests. -->
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      html, body { margin: 0; min-height: 100%; }
      body {
        min-height: 100dvh; display: flex; align-items: center; justify-content: center;
        padding: max(24px, env(safe-area-inset-top)) 20px max(24px, env(safe-area-inset-bottom));
        background: radial-gradient(1200px 600px at 50% -10%, #e7f3ec 0%, #f7f9f7 55%);
        color: #202622; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .card {
        width: 100%; max-width: 420px; text-align: center; background: #fff; border: 1px solid #e1e7e2;
        border-radius: 20px; padding: 32px 24px; box-shadow: 0 20px 50px -24px rgba(31, 95, 60, .25);
        animation: rise .5s cubic-bezier(.2, .8, .2, 1) both;
      }
      .logo { width: 72px; height: 72px; border-radius: 18px; border: 1px solid #e1e7e2; display: block; margin: 0 auto 20px; }
      h1 { margin: 0 0 8px; font-size: 20px; line-height: 1.3; }
      p { margin: 0; color: #68736c; font-size: 14px; line-height: 1.55; }
      .status {
        display: inline-flex; align-items: center; gap: 8px; margin: 20px 0 24px; padding: 6px 12px;
        border-radius: 999px; font-size: 13px; font-weight: 600; background: #fbf1df; color: #8a5a00;
      }
      .dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; animation: pulse 1.6s ease-in-out infinite; }
      .status.online { background: #e7f3ec; color: #1f5f3c; }
      button {
        width: 100%; height: 44px; border: 0; border-radius: 10px; background: #2f8f5b; color: #fff;
        font: inherit; font-size: 15px; font-weight: 600; cursor: pointer; transition: background .15s;
      }
      button:hover { background: #287a4d; }
      button:focus-visible { outline: 2px solid #1f5f3c; outline-offset: 2px; }
      .hint { margin-top: 16px; font-size: 12px; color: #89938d; }
      @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
      @keyframes pulse { 50% { opacity: .35; } }
      @media (prefers-reduced-motion: reduce) { .card, .dot { animation: none; } }
    </style>
  </head>
  <body>
    <main class="card">
      <img class="logo" src="/icons/icon-192.png" alt="" width="72" height="72" />
      <h1>Нет подключения к интернету</h1>
      <p>Okurmen Kids не может связаться с сервером. Ваши данные в безопасности — как только связь появится, приложение откроется само.</p>
      <div id="status" class="status" role="status" aria-live="polite"><span class="dot"></span><span id="status-text">Офлайн — ждём подключения</span></div>
      <button id="retry" type="button">Повторить подключение</button>
      <p class="hint">Несохранённые изменения не отправляются в офлайне.</p>
    </main>
    <script>
      (function () {
        var status = document.getElementById('status')
        var text = document.getElementById('status-text')
        function reload() { location.reload() }
        function update() {
          var online = navigator.onLine
          status.className = online ? 'status online' : 'status'
          text.textContent = online ? 'Подключение есть — открываем…' : 'Офлайн — ждём подключения'
          if (online) setTimeout(reload, 600)
        }
        document.getElementById('retry').addEventListener('click', reload)
        window.addEventListener('online', update)
        window.addEventListener('offline', update)
        // navigator.onLine can be true while the network is still unusable:
        // keep probing gently and reload once a request actually succeeds.
        setInterval(function () {
          if (!navigator.onLine) return
          fetch('/manifest.webmanifest', { cache: 'no-store' }).then(function (r) { if (r.ok) reload() }, function () {})
        }, 10000)
      })()
    </script>
  </body>
</html>
