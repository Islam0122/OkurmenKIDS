<!-- Okurmen Kids badge mark (PWA icon art). Redrawn as vectors from
     public/logo.png so it stays sharp at every icon size. 512×512 viewBox,
     centered at 256,256; the generator places it on the brand background. -->
<g xmlns="http://www.w3.org/2000/svg">
  <circle cx="256" cy="256" r="176" fill="#ffffff"/>
  <circle cx="256" cy="256" r="168" fill="none" stroke="#dba43a" stroke-width="9"/>
  <!-- glasses -->
  <rect x="165" y="200" width="71" height="38" rx="7" fill="none" stroke="#1d1f5c" stroke-width="6"/>
  <rect x="255" y="198" width="88" height="43" rx="8" fill="none" stroke="#1d1f5c" stroke-width="6"/>
  <path d="M158 197 C172 184 192 178 210 179 C206 184 190 186 168 197 Z" fill="#1d1f5c"/>
  <path d="M281 160 C286 156 292 157 296 160 C318 168 334 180 345 196 C328 184 306 175 283 170 C277 168 276 163 281 160 Z" fill="#1d1f5c"/>
  <!-- wordmark -->
  <text x="256" y="299" text-anchor="middle" font-family="Manrope Variable, sans-serif" font-weight="800"
        font-size="54" fill="#dba43a" textLength="290" lengthAdjust="spacingAndGlyphs">ОКУРМЭН</text>
  <text x="256" y="333" text-anchor="middle" font-family="Manrope Variable, sans-serif" font-weight="800"
        font-size="25" letter-spacing="7" fill="#1d1f5c">KIDS</text>
</g>
